services:
  # ============================================================
  # API Gateway — the single public-facing entry point
  # ============================================================
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        sync: false
      - key: TENANT_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ============================================================
  # Tenant Service — core tenant lifecycle and orchestration
  # ============================================================
  - type: web
    name: tenant-service
    runtime: docker
    dockerfilePath: ./backend/tenant-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        # Auto-generated on first deploy; must be >=32 chars (enforced by Joi).
        generateValue: true
      # Encrypts each company's Stripe key at rest.
      - key: ORG_SECRETS_KEY
        generateValue: true
      # Shared with billing-service for GET /internal/*.
      - key: INTERNAL_API_TOKEN
        sync: false

  # ============================================================
  # DB Provisioner — creates isolated DB schemas per tenant
  # ============================================================
  - type: web
    name: db-provisioner-service
    runtime: docker
    dockerfilePath: ./backend/db-provisioner-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ============================================================
  # Credentials Service — generates API keys per tenant
  # ============================================================
  - type: web
    name: credentials-service
    runtime: docker
    dockerfilePath: ./backend/credentials-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ============================================================
  # DNS Provisioner — registers subdomains per tenant
  # ============================================================
  - type: web
    name: dns-provisioner-service
    runtime: docker
    dockerfilePath: ./backend/dns-provisioner-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        sync: false

  # ============================================================
  # Billing Service — Stripe customer and subscription creation
  # ============================================================
  - type: web
    name: billing-service
    runtime: docker
    dockerfilePath: ./backend/billing-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        sync: false
      # Each company connects its own Stripe account; billing fetches it from
      # tenant-service's internal API.
      - key: TENANT_SERVICE_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false

  # ============================================================
  # Notification Service — mock welcome-email step, then publishes
  # provisioning.complete (real emails are sent by tenant-service)
  # ============================================================
  - type: web
    name: notification-service
    runtime: docker
    dockerfilePath: ./backend/notification-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        sync: false
